name: apply-bitcoin-hardening-once

on:
  push:
    branches: ["bitcoin-defaults-dashboard-scope"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bitcoin-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bitcoin-defaults-dashboard-scope

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Bitcoin hardening
        run: |
          python tools/apply_bitcoin_hardening.py
          python tools/fix_bitcoin_hardening.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Verify imports
        run: |
          python -c "from quant_loop_trader import data, evaluation, experiment, autonomy, report; from quant_loop_trader.dashboard import queries, service; print('imports ok')"

      - name: Lint critical failures
        run: ruff check src/ tests/ --select E9,F63,F7,F82,F401 --fix

      - name: Run offline test suite
        env:
          TIINGO_API_KEY: ""
          FRED_API_KEY: ""
          ALPACA_API_KEY: ""
          ALPACA_SECRET_KEY: ""
        run: pytest -q -m "not integration"

      - name: Remove one-off migration machinery
        run: |
          rm tools/apply_bitcoin_hardening.py
          rm tools/fix_bitcoin_hardening.py
          rm .github/workflows/apply-bitcoin-hardening-once.yml

      - name: Commit hardened runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Bitcoin the active runtime and dashboard default [bitcoin-hardening-applied]"
          git push origin HEAD:bitcoin-defaults-dashboard-scope

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Verify imports
        run: |
          python -c "
          import quant_loop_trader
          from quant_loop_trader import data, replay, features, evaluation, experiment
          from quant_loop_trader import agents, research_memory, autonomy, report, paper_trading
          from quant_loop_trader.connectors import alpaca, fred, sec
          from quant_loop_trader.features import macro, fundamental, technical
          from quant_loop_trader.validation import holdout, ablation, walkforward, multiple_testing, dashboard
          from quant_loop_trader.research import hypothesis_engine, experiment_generator, hypothesis_ranker
          from quant_loop_trader.monitoring import heartbeat, health, alerts
          print('all imports ok')
          "

      - name: Lint (ruff)
        run: ruff check src/ tests/ --select E9,F63,F7,F82,F401 --fix

      - name: Run tests (offline — integration tests skip without credentials)
        env:
          TIINGO_API_KEY: ""
          FRED_API_KEY: ""
          ALPACA_API_KEY: ""
          ALPACA_SECRET_KEY: ""
        run: pytest -q -m "not integration"

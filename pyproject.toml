[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-loop-trader"
version = "0.1.0"
description = "Historical-replay stock prediction engine"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = ["integration: live API tests, skipped when credentials absent"]
